services:
  postgres:
    image: postgres:16-alpine
    container_name: fastroute_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastroute_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastroute_password}
      POSTGRES_DB: ${POSTGRES_DB:-fastroute_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastroute_user} -d ${POSTGRES_DB:-fastroute_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: fastroute_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-buckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: fastroute_minio_buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing localminio/${MINIO_RAW_BUCKET:-fastroute-raw};
      /usr/bin/mc mb --ignore-existing localminio/${MINIO_STAGING_BUCKET:-fastroute-staging};
      exit 0;
      "

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.2.23-alpine
    container_name: fastroute_clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-fastroute_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: fastroute_airflow_webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fastroute_user}:${POSTGRES_PASSWORD:-fastroute_password}@postgres:5432/${POSTGRES_DB:-fastroute_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46GadBkiBicSIip2Yzc7U-zW465_VGGBfV6_r9bE1_4=}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-clickhouse-connect==0.7.3 pydantic-settings==2.2.1}
    ports:
      - "8080:8080"
    volumes:
      - ./src/orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username ${AIRFLOW_ADMIN_USER:-airflow} --password ${AIRFLOW_ADMIN_PASSWORD:-airflow} --firstname FastRoute --lastname Admin --role Admin --email admin@fastroute.com || true &&
               airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    container_name: fastroute_airflow_scheduler
    restart: always
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fastroute_user}:${POSTGRES_PASSWORD:-fastroute_password}@postgres:5432/${POSTGRES_DB:-fastroute_db}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-clickhouse-connect==0.7.3 pydantic-settings==2.2.1}
    volumes:
      - ./src/orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler

  streamlit-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: fastroute_streamlit_ui
    restart: always
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - MINIO_HOST=minio
      - CLICKHOUSE_HOST=clickhouse
      - AIRFLOW_HOST=airflow-webserver
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
    depends_on:
      - postgres
      - minio
      - clickhouse

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  airflow_logs:
