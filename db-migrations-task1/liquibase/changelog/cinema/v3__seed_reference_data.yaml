      changes:
        - sql:
            sql: |
              INSERT INTO screens (id, cinema_id, screen_number, capacity, screen_type) VALUES
                  (1, 1, 1, 120, 'imax'),
                  (2, 1, 2,  80, '3d'),
                  (3, 2, 1, 150, '2d'),
                  (4, 3, 1,  60, '2d'),
                  (5, 4, 1, 200, 'imax');
              SELECT setval('screens_id_seq', (SELECT MAX(id) FROM screens));
      rollback:
        - sql:
            sql: DELETE FROM screens WHERE id IN (1, 2, 3, 4, 5);

